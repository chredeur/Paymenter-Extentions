name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run from the Actions tab: builds the archives and uploads them as build
  # artifacts, without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One zip per extension, named after the extension folder. Paymenter's admin
      # uploader expects an archive whose root holds the extension directory.
      - name: Build extension archives
        run: |
          mkdir -p dist
          for dir in extensions/*/*/; do
            name=$(basename "$dir")
            (cd "$(dirname "$dir")" && zip -r "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          ls -l dist

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
